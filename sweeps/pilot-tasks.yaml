# The task run: every user task and every injection task check against every model with the baseline and no attack, to
# measure each model's utility and the highest ASR it can reach before the runs with attacks and with defenses.
#
#   uv run ipi check-suite                                                      # check the suite, no model call
#   uv run ipi sweep sweeps/pilot-tasks.yaml --dry-run                          # print the runs per run type: total, done, to do
#   uv run --env-file .env ipi sweep sweeps/pilot-tasks.yaml                    # do the runs; rerun to resume, completed runs are skipped
#   uv run ipi show --summary runs-pilot/<model>/workspace/*/none/none.json     # one row per run and the summary line, for one model's directory
#   uv run ipi show runs-pilot/<model>/workspace/*/none/none.json               # every run file in full, for the inspection
#
# Run type counts: M = models (5), D = defenses (1), A = attacks (0), U = user tasks (50), I = injection tasks (25);
# every task of the suite.
suite: workspace
logdir: runs-pilot
temperature: 0.0

models: [openai/gpt-5.4-mini, google/gemini-3.5-flash-lite, deepseek/deepseek-v4.1-flash, qwen/qwen3.7-flash, mistralai/mistral-medium-3]
defenses: [none]
attacks: []

run_types:
  utility: {}                # user task alone:       M × D × U = 250
  injection_task_checks: {}  # injection task alone:  M × I = 125

concurrency: {openai: 16, google: 16, openrouter: 8}  # runs in flight per provider; others share openrouter
