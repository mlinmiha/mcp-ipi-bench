# The defense run: the four defenses against every model, with the four attacks of the experiment and with no attack,
# to see that every defense works on every model before the main sweep. The baseline runs to compare with are the
# runs of sweeps/pilot-tasks.yaml and sweeps/pilot-attacks.yaml in the same logdir.
#
#   uv run ipi sweep sweeps/pilot-defenses.yaml --dry-run                            # print the runs per run type: total, done, to do
#   uv run --env-file .env ipi sweep sweeps/pilot-defenses.yaml                      # do the runs; rerun to resume, completed runs are skipped
#   uv run ipi show --summary runs-pilot/*-<defense>/workspace/*/<attack>/*.json     # one row per run and the summary line, for one defense and attack
#   uv run ipi show --summary runs-pilot/*-<defense>/workspace/*/none/none.json      # the same for the runs with no attack
#   uv run ipi show runs-pilot/*-<defense>/workspace/*/*/*.json                      # every run file in full, for the inspection
#
# Run type counts: M = models (5), D = defenses (4), A = attacks (4), U = user tasks (20), I = injection tasks (5);
# the first four user tasks and the third injection task of each domain; 25 = their pairs in the balanced subset, which
# are with the third user task of each domain and are among the 100 pairs sweeps/pilot-attacks.yaml runs.
suite: workspace
logdir: runs-pilot
temperature: 0.0

models: [openai/gpt-5.4-mini, google/gemini-3.5-flash-lite, deepseek/deepseek-v4.1-flash, qwen/qwen3.7-flash, mistralai/mistral-medium-3]
defenses: [spotlighting, sanitizer, tool-filter, security-policy]
attacks: [direct-instruction, fake-completion, task-aligned, tool-notice]
user_tasks: [email_user_task_0, email_user_task_1, email_user_task_2, email_user_task_3,
             web_user_task_0, web_user_task_1, web_user_task_2, web_user_task_3,
             cloud_storage_user_task_0, cloud_storage_user_task_1, cloud_storage_user_task_2, cloud_storage_user_task_3,
             calendar_user_task_0, calendar_user_task_1, calendar_user_task_2, calendar_user_task_3,
             issue_tracking_user_task_0, issue_tracking_user_task_1, issue_tracking_user_task_2, issue_tracking_user_task_3]
injection_tasks: [email_injection_task_2, web_injection_task_2, cloud_storage_injection_task_2, calendar_injection_task_2, issue_tracking_injection_task_2]

run_types:
  utility: {}                # user task alone:        M × D × U = 400
  security: {pairs: subset}  # user task + injection:  M × D × A × 25 = 2000

concurrency: {openai: 16, google: 16, openrouter: 4}  # runs in flight per provider; others share openrouter
