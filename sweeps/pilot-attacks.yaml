# The candidate pilot: the four attacks of the experiment against every model with no defense, to measure each attack's
# ASR before the main sweep.
#
#   uv run ipi sweep sweeps/pilot-attacks.yaml --dry-run                          # print the runs per run type: total, done, to do
#   uv run --env-file .env ipi sweep sweeps/pilot-attacks.yaml                    # do the runs; rerun to resume, completed runs are skipped
#   uv run ipi show --summary runs-pilot/*/workspace/*/<attack>/*.json            # one row per run and the summary line, for one attack
#   uv run ipi show runs-pilot/*/workspace/*/<attack>/*.json                      # every run file in full, for the inspection
#
# Run type counts: M = models (5), D = defenses (1), A = attacks (4), U = user tasks (20), I = injection tasks (25);
# the first four tasks of each domain; 100 = their pairs in the balanced subset, the same pairs sweeps/main.yaml runs.
suite: workspace
logdir: runs-pilot
temperature: 0.0

models: [openai/gpt-5.4-mini, google/gemini-3.5-flash-lite, deepseek/deepseek-v4.1-flash, qwen/qwen3.7-flash, mistralai/mistral-medium-3]
defenses: [none]
attacks: [direct-instruction, fake-completion, task-aligned, tool-notice]
user_tasks: [email_user_task_0, email_user_task_1, email_user_task_2, email_user_task_3,
             web_user_task_0, web_user_task_1, web_user_task_2, web_user_task_3,
             cloud_storage_user_task_0, cloud_storage_user_task_1, cloud_storage_user_task_2, cloud_storage_user_task_3,
             calendar_user_task_0, calendar_user_task_1, calendar_user_task_2, calendar_user_task_3,
             issue_tracking_user_task_0, issue_tracking_user_task_1, issue_tracking_user_task_2, issue_tracking_user_task_3]

run_types:
  security: {pairs: subset}  # user task + injection:  M × D × A × 100 = 2000

concurrency: {openai: 16, google: 16, openrouter: 8}  # runs in flight per provider; others share openrouter
